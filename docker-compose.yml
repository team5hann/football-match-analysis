services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_analysis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://football:football@db:5432/football_analysis
      VIDEO_STORAGE_DIR: /app/storage/videos
      CORS_ORIGINS: https://glowing-goggles-wrr499vxq54gcg6wr-3000.app.github.dev
    volumes:
      - video_storage:/app/storage/videos
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://glowing-goggles-wrr499vxq54gcg6wr-8000.app.github.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: https://glowing-goggles-wrr499vxq54gcg6wr-8000.app.github.dev
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  video_storage:
